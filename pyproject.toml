[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdit"
version = "0.1.0"
description = "Reproducible record-private federated DiT LoRA pilot"
requires-python = ">=3.10,<3.14"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["cuda: opt-in pretrained CUDA integration"]
