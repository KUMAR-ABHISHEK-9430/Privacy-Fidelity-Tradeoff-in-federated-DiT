model_id: facebook/DiT-XL-2-256
model_revision: main
dataset: eurosat_rgb
num_clients: 3
seed: 42
partition_seed: 43
noise_seed: 44
sampler_seed: 45
evaluation_seed: 46
lora_rank: 4
lora_alpha: 4
learning_rate: 0.0001
max_grad_norm: 1.0
delta: 0.000001
precision: bf16
dirichlet_alpha: 0.1
physical_batch_size: 8
generation_batch_size: 16
data_root: data
cache_root: .cache/fdit
results_root: results
fast:
  rounds: 6
  local_steps_per_round: 8
  expected_logical_batch_size: 16
  eval_samples_per_condition: 96
  sampling_steps: 15
full:
  rounds: 12
  local_steps_per_round: 15
  expected_logical_batch_size: 32
  eval_samples_per_condition: 512
  sampling_steps: 25
conditions:
  - {partition: iid, dp: false, id: iid_nodp}
  - {partition: iid, dp: true, epsilon: 8.0, id: iid_eps8}
  - {partition: iid, dp: true, epsilon: 3.0, id: iid_eps3}
  - {partition: non_iid, dp: false, id: skew_nodp}
  - {partition: non_iid, dp: true, epsilon: 8.0, id: skew_eps8}
  - {partition: non_iid, dp: true, epsilon: 3.0, id: skew_eps3}

# Default launcher runs this non-private diagnostic, NOT the factorial suite.
diagnostic:
  output_root: diagnostics
  federated_results: results
  federated_conditions: [iid_nodp, iid_eps8, iid_eps3, skew_nodp, skew_eps8, skew_eps3]
  max_steps: 1000
  milestones: [500, 1000]
  checkpoint_interval: 100
  grid_interval: 100
  log_interval: 10
  batch_size: 32
  physical_batch_size: 8
  learning_rate: 0.0001
  precision: bf16
  eval_samples: 512
  generation_batch_size: 16
  sampling_steps: 25
  validation_samples: 96
  vae_reconstruction_samples: 64
  vae_min_psnr_db: 20.0
  probe_steps: 2
  aggregation_local_steps: 2
  preview_samples: 16
  min_relative_fid_improvement: 0.05
  min_relative_validation_improvement: 0.02
